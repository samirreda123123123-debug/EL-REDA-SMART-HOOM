name: Build Smart Home APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install dependencies and build web app
        run: |
          npm install
          npm run build

      - name: Add Capacitor and build Android project
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "ElReda Smart Home" "com.elreda.smarthome" --web-dir=dist
          npx cap add android
          npx cap sync android

      - name: Allow HTTP and Fix Kotlin Duplicate Class
        run: |
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          cat << 'EOF' >> android/app/build.gradle
          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          EOF

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ElReda-Smart-Home-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
